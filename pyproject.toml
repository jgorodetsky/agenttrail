[project]
name = "agenttrail"
version = "0.1.0"
description = "Structured audit logging for AI agent actions. OWASP AOS + OCSF implementation."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai", "agent", "security", "audit", "ocsf", "mcp", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/jgorodetsky/agenttrail"

[project.scripts]
agenttrail = "agenttrail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["agenttrail"]
omit = [
    "src/agenttrail/server/outputs/s3.py",
    "src/agenttrail/server/outputs/sqs.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]
