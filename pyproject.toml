[project]
name = "agenttrail"
version = "0.1.0"
description = "Agent audit logging framework implementing OWASP AOS + OCSF"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio[trio]>=4.0",
    "ruff>=0.8",
]

[project.scripts]
agenttrail = "agenttrail.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agenttrail"]
omit = [
    "agenttrail/server/outputs/s3.py",
    "agenttrail/server/outputs/sqs.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "pass",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
